<section class="dlg">
  <header class="dlg-head purple">
    <h1>Settings</h1>
    <button type="button" class="sq red" data-close aria-label="Close" data-icon="close"></button>
  </header>
  <div class="dlg-body">
    <div class="well toggles">
      <button
        type="button"
        id="t-sound"
        class="sq blue tbtn"
        aria-label="Sound"
        aria-pressed="true"
        data-icon="sound"
      ></button>
      <button
        type="button"
        id="t-music"
        class="sq blue tbtn"
        aria-label="Music"
        aria-pressed="true"
        data-icon="music"
      ></button>
      <button
        type="button"
        id="t-vibration"
        class="sq blue tbtn"
        aria-label="Vibration"
        aria-pressed="true"
        data-icon="vibrate"
      ></button>
      <a class="sq purple tbtn" href="#/" aria-label="Home" data-icon="home"></a>
    </div>
    <div class="stackbtn">
      <a class="btn" href="#/language" data-icon="globe">Language</a>
      <button type="button" id="privacy" class="btn primary">Privacy Policy</button>
      <a class="btn purple" href="#/rate" data-icon="gamepad">Rate Us</a>
      <button type="button" id="withdraw" class="btn accent">Withdraw Consent</button>
    </div>
    <p class="version">V1.0</p>
  </div>
</section>
