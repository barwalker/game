<section class="dlg">
  <header class="dlg-head purple">
    <h1>Rate Us</h1>
    <button type="button" class="sq red" data-close aria-label="Close" data-icon="close"></button>
  </header>
  <div class="dlg-body">
    <div class="promo"><img src="assets/img/hero.webp" alt="" width="200" height="200" /></div>
    <p class="ask">Like the Game?<br />Rate Us Please!</p>
    <div id="stars" class="stars" role="group" aria-label="Rating">
      <button type="button" class="star" data-v="1" aria-label="1 star" data-icon="star"></button>
      <button type="button" class="star" data-v="2" aria-label="2 stars" data-icon="star"></button>
      <button type="button" class="star" data-v="3" aria-label="3 stars" data-icon="star"></button>
      <button type="button" class="star" data-v="4" aria-label="4 stars" data-icon="star"></button>
      <button type="button" class="star" data-v="5" aria-label="5 stars" data-icon="star"></button>
    </div>
    <button type="button" id="rate-submit" class="btn primary big">Submit</button>
  </div>
</section>
